name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DATABASE_URL,JWT_SECRET,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,CLOUDINARY_URL,EMAIL_USER,EMAIL_HOST,EMAIL_PASS,EMAIL_PORT
          script: |

            set -e
            REPO_DIR="$HOME/congo-sphere-backend"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR" && git pull origin main
            else
              git clone --branch main "$REPO_URL" "$REPO_DIR" && cd "$REPO_DIR"
            fi

            # Write .env from secrets
            cat > .env <<EOF
            PORT=3000
            DATABASE_URL=${DATABASE_URL}
            REDIS_HOST=redis
            REDIS_PORT=6379
            JWT_SECRET=${JWT_SECRET}
            CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
            CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
            CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
            CLOUDINARY_URL=${CLOUDINARY_URL}
            EMAIL_USER=${EMAIL_USER}
            EMAIL_HOST=${EMAIL_HOST}
            EMAIL_PASS=${EMAIL_PASS}
            EMAIL_PORT=${EMAIL_PORT}
            EOF

            # Build
            sudo docker compose --profile prod up -d --build

            sleep 5
            if ! sudo docker compose ps --status running --services | grep -q '^app$'; then
              echo "App container failed to start, rolling back..."
              sudo docker compose logs --tail=50 app
              exit 1
            fi

            # Cleanup unused images
            sudo docker image prune -f
