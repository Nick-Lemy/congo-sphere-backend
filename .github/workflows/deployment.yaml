name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_image: ${{ steps.names.outputs.app_image }}
      migrate_image: ${{ steps.names.outputs.migrate_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image names
        id: names
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          TAG="${GITHUB_SHA::7}"
          echo "app_image=ghcr.io/${REPO}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "migrate_image=ghcr.io/${REPO}-migrate:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          target: builder
          push: true
          tags: ${{ steps.names.outputs.migrate_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          target: runner
          push: true
          tags: ${{ steps.names.outputs.app_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build.outputs.app_image }}
          MIGRATE_IMAGE: ${{ needs.build.outputs.migrate_image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: APP_IMAGE,MIGRATE_IMAGE,GHCR_USER,GHCR_TOKEN,DATABASE_URL,JWT_SECRET,CLOUDINARY_CLOUD_NAME,CLOUDINARY_API_KEY,CLOUDINARY_API_SECRET,CLOUDINARY_URL,EMAIL_USER,EMAIL_HOST,EMAIL_PASS,EMAIL_PORT
          script: |
            set -e
            REPO_DIR="$HOME/congo-sphere-backend"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR" && git pull origin main
            else
              git clone --branch main "$REPO_URL" "$REPO_DIR" && cd "$REPO_DIR"
            fi

            cat > .env <<EOF
            PORT=3000
            APP_IMAGE=${APP_IMAGE}
            MIGRATE_IMAGE=${MIGRATE_IMAGE}
            DATABASE_URL=${DATABASE_URL}
            REDIS_HOST=redis
            REDIS_PORT=6379
            JWT_SECRET=${JWT_SECRET}
            CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
            CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
            CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
            CLOUDINARY_URL=${CLOUDINARY_URL}
            EMAIL_USER=${EMAIL_USER}
            EMAIL_HOST=${EMAIL_HOST}
            EMAIL_PASS=${EMAIL_PASS}
            EMAIL_PORT=${EMAIL_PORT}
            EOF

            echo "${GHCR_TOKEN}" | sudo docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            sudo docker compose --profile prod pull

            if ! sudo docker compose --profile prod up -d --no-build; then
              echo "--- migrate logs ---"
              sudo docker compose logs --tail=50 migrate || true
              echo "--- app logs ---"
              sudo docker compose logs --tail=50 app || true
              exit 1
            fi

            sleep 5
            if ! sudo docker compose ps --status running --services | grep -q '^app$'; then
              echo "App container failed to start:"
              sudo docker compose logs --tail=50 app
              exit 1
            fi

            sudo docker logout ghcr.io
            sudo docker image prune -f
