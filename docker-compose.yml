services:
  redis:
    image: redis:8-alpine
    container_name: congo-sphere-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: ['prod']
    build:
      context: .
      target: builder
    container_name: congo-sphere-migrate
    command: pnpm prisma migrate deploy
    env_file: .env
    restart: 'no'

  app:
    profiles: ['prod']
    build:
      context: .
    container_name: congo-sphere-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - '3000:3000'
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  redis_data:
